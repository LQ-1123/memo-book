[project]
name = "personal-library"
version = "0.1.0"
description = "个人 RAG 知识库：监听目录入库 + 混合检索 + 引用问答"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "openai>=1.55",
    "qdrant-client>=1.12",
    "pymupdf>=1.24",
    "trafilatura>=1.13",
    "jieba>=0.42",
    "watchdog>=5.0",
    "rapidocr-onnxruntime>=1.4",
    "yt-dlp>=2025.1.1",
    "pymupdf4llm>=0.0.27",
    "markitdown[docx,pptx,xlsx]>=0.1.3",
    "qrcode>=8.0",
    "pywebview>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx", "pyinstaller>=6.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
